<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        ol, ul, .special, #another-paragraph{
            background-color: lightblue;

        }
        .red{
            background-color: rgb(255, 0, 0); 
        }
        .bold{
            font-weight: bold;
            color: rgb(31, 197, 16);
        }

        .green.bold{
            font-size: 2.5rem;  
        }


        /* article p{
            background-color: salmon;
        } */


        article > p{
            background-color: salmon;
        }
        

    </style>
</head>
<body>

    <h2 class="special">this is a heading</h2>
    <p>this is a paragraph</p>
    <h2>another heading</h2>
    <p id="another-paragraph">another paragraph</p>
    <ol>
        <li>Item 1</li>
        <li class="red bold">Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li class="green bold">Item 5</li>
    </ol>

    <ul>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
        <li>item 4</li>
        <li>item 5</li>
    </ul>


    <article>
        <p>this is an article</p>
    </article>

    <article>
        <p>this is an article</p>
    </article>

    <article>
        <p>this is an article</p>
        <div>
            <p>this is a div inside an article</p>
        </div>
    </article>

</body>
</html>
