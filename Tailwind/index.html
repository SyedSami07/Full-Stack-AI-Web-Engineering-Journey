<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- tailwind -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h2 class="text-red-500">hello tailwind</h2>

    <div class="group w-80 overflow-hidden rounded-3xl border border-white/10 bg-zinc-950 shadow-2xl transition duration-500 hover:-translate-y-2 hover:shadow-black/50">

  <!-- Image -->
  <div class="relative overflow-hidden">
    <img
      src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
      alt="Smart Watch"
      class="h-80 w-full object-cover transition duration-700 group-hover:scale-110"
    />

    <!-- Gradient -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>

    <!-- Badge -->
    <span class="absolute left-4 top-4 rounded-full bg-white/90 px-3 py-1 text-xs font-bold uppercase tracking-wider text-black backdrop-blur">
      New
    </span>

    <!-- Wishlist -->
    <button class="absolute right-4 top-4 flex h-10 w-10 items-center justify-center rounded-full bg-black/40 text-xl text-white backdrop-blur transition hover:bg-white hover:text-black">
      ♡
    </button>
  </div>

  <!-- Content -->
  <div class="p-6">

    <div class="mb-2 flex items-center gap-1 text-sm text-yellow-400">
      ★★★★★
      <span class="ml-1 text-zinc-500">(128)</span>
    </div>

    <h2 class="text-2xl font-bold tracking-tight text-white">
      Chrono X
    </h2>

    <p class="mt-2 text-sm leading-6 text-zinc-400">
      Minimal design. Powerful performance. Built for everyday life.
    </p>

    <!-- Bottom -->
    <div class="mt-6 flex items-end justify-between">

      <div>
        <p class="text-xs uppercase tracking-wider text-zinc-500">
          Price
        </p>
        <p class="text-2xl font-bold text-white">
          $129
        </p>
      </div>

      <button class="rounded-xl bg-white px-5 py-3 text-sm font-bold text-black transition duration-300 hover:bg-zinc-200 hover:scale-105">
        Add to Cart →
      </button>

    </div>
  </div>
</div>
    
</body>
</html>
